name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    strategy:
      matrix:
        platform: [x86, x64]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - uses: microsoft/setup-msbuild@v2
      - uses: nuget/setup-nuget@v2
      - name: Build
        shell: pwsh
        run: |
          nuget restore SUWSF.sln
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          msbuild SUWSF.sln -p:Configuration=Release -p:Platform=${{ matrix.platform }} -p:BuildVersion="${{ github.sha }}"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory package,dist
          Copy-Item '${{ matrix.platform }}/Release/SUWSF.asi',README.md,LICENSE,SUWSF.ini package/
          $name = 'SUWSF-${{ matrix.platform }}.zip'
          Compress-Archive package/* "dist/$name"
          $hash = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content "dist/$name.sha256" -Encoding ascii
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: SUWSF-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: SUWSF-*
          merge-multiple: true
          path: dist
      - name: Publish downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.zip dist/*.sha256 \
            --verify-tag --prerelease --latest=false --title "$RELEASE_TAG" \
            --notes 'SUWSF with optional compatibility checks. Built from source by Actions; supply an ASI loader separately.'
