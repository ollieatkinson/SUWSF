name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      source-ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    strategy:
      matrix:
        platform: [x86, x64]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          repository: ollieatkinson/SUWSF
          ref: ${{ inputs.source-ref || github.sha }}
          submodules: recursive
      - uses: microsoft/setup-msbuild@v2
      - uses: nuget/setup-nuget@v2
      - name: Build
        shell: pwsh
        run: |
          nuget restore SUWSF.sln
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          msbuild SUWSF.sln -p:Configuration=Release -p:Platform=${{ matrix.platform }} -p:BuildVersion="${{ github.sha }}"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory package,dist
          Copy-Item '${{ matrix.platform }}/Release/SUWSF.asi',README.md,LICENSE,SUWSF.ini package/
          $name = 'SUWSF-${{ matrix.platform }}.zip'
          Compress-Archive package/* "dist/$name"
          $hash = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content "dist/$name.sha256" -Encoding ascii
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: SUWSF-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
